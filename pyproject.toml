[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lantern-risk"
version = "0.1.0"
description = "An open-source, Aladdin-style platform for cross-asset factor risk, scenario simulation and systematic factor investing."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Zhuangyan (Raymond) Li" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pandas>=2.2",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "requests>=2.28",
    "pyyaml>=6.0",
    "plotly>=5.15",
]

[project.optional-dependencies]
fast = ["numba>=0.57"]
app = ["streamlit>=1.50"]
dev = ["pytest>=7"]
all = ["numba>=0.57", "streamlit>=1.50", "pytest>=7"]

[project.scripts]
lantern = "lantern.cli:main"

[tool.setuptools.packages.find]
include = ["lantern*"]

[tool.setuptools.package-data]
"lantern.systematic" = ["resources/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
